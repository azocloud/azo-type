# release-plz.toml
# Automated semantic versioning, changelog generation, and Git tagging for azo-type.

[workspace]
# Desktop application: do not publish to crates.io.
publish = false
# Determine the current version from Git tags instead of querying crates.io.
git_only = true

# Library API SemVer checks are unnecessary for a desktop binary application.
semver_check = false
# Only create a release/tag when a Release PR generated by release-plz is merged.
release_always = false

# Automatically create Git tags (e.g., v0.1.0) when the Release PR is merged.
git_tag_enable = true
git_tag_name = "v{{ version }}"

# The publish-release job in .github/workflows/release.yml creates the GitHub Release
# after all 6 cross-platform build targets complete.
git_release_enable = false

# Ensure `feat:` commits bump the minor version even while in 0.x (e.g., 0.1.0 -> 0.2.0).
features_always_increment_minor = true

[changelog]
commit_parsers = [
  { message = "^[a-z]+\\(website\\)", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore: release", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs?", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^build", group = "Build" },
  { message = "^chore", group = "Miscellaneous" },
  { message = "^ci", skip = true },
  { message = "^style", skip = true },
  { message = "^revert", group = "Reverted" },
  { message = ".*", group = "Other" },
]
