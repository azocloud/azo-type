name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'app/**'
      - 'locales/**'
      - '.cargo/**'
      - 'release-plz.toml'
      - 'cliff.toml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. On pushes to main, either create a Git tag when a Release PR was merged,
  #    or open/update the Release PR for unreleased commits.
  release-plz:
    name: Manage Version & Release PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      release_tag: ${{ steps.extract-tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz release (create tag on Release PR merge)
        id: release
        uses: release-plz/action@v0.5
        with:
          command: release
          manifest_path: app/Cargo.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run release-plz release-pr (open or update Release PR)
        if: steps.release.outputs.releases_created != 'true'
        uses: release-plz/action@v0.5
        with:
          command: release-pr
          manifest_path: app/Cargo.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract created tag name
        id: extract-tag
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASES_JSON: ${{ steps.release.outputs.releases }}
        run: |
          TAG=$(echo "$RELEASES_JSON" | jq -r '.[0].tag')
          echo "Created release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # 2. Run checks and build all 6 release targets when a Release PR was merged or a v* tag was pushed.
  build-all:
    name: CI & Multi-Target Builds
    needs: [release-plz]
    if: >-
      always() &&
      (needs.release-plz.result == 'success' || needs.release-plz.result == 'skipped') &&
      (needs.release-plz.outputs.releases_created == 'true' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/ci.yml
    with:
      is_release: true
      release_tag: ${{ needs.release-plz.outputs.release_tag || github.ref_name }}

  # 3. Create the GitHub Release with git-cliff notes and attach all 6 release packages.
  publish-release:
    name: Publish GitHub Release
    needs: [release-plz, build-all]
    if: >-
      always() &&
      (needs.release-plz.result == 'success' || needs.release-plz.result == 'skipped') &&
      needs.build-all.result == 'success'
    runs-on: ubuntu-latest
    env:
      TARGET_TAG: ${{ needs.release-plz.outputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout full Git history at release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_TAG }}

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate release notes from Conventional Commits
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          git cliff --config cliff.toml --latest --strip header -o RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${TARGET_TAG}" > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release & upload packages
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TARGET_TAG }}
          name: Release ${{ env.TARGET_TAG }}
          files: release-assets/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(env.TARGET_TAG, '-rc') || contains(env.TARGET_TAG, '-beta') || contains(env.TARGET_TAG, '-alpha') }}
