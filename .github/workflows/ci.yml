name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'app/**'
      - 'locales/**'
      - '.cargo/**'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - 'scripts/check.sh'
      - 'scripts/verify_structural_rules.py'
      - 'docs/agent/PROJECT_MAP.md'
      - '.github/workflows/ci.yml'

  workflow_call:
    inputs:
      is_release:
        description: 'Build release archives and upload artifacts for GitHub Release'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Git tag for archive filenames (e.g. v0.1.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  APP_NAME: azo-type
  RELEASE_TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}

jobs:
  check:
    name: Format, Clippy, Structure & Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux build and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang mold pkg-config \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev libssl-dev \
            libgtk-3-dev libwayland-dev libx11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check --manifest-path app/Cargo.toml

      - name: Run Clippy linter
        run: cargo clippy --all-targets --manifest-path app/Cargo.toml --locked -- -D warnings

      - name: Verify structural conventions and PROJECT_MAP
        run: python3 scripts/verify_structural_rules.py

      - name: Run test suite
        run: cargo test --manifest-path app/Cargo.toml --locked

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    needs: [check]
    if: ${{ github.event_name == 'pull_request' || inputs.is_release == true }}
    # On PRs, `check` already compiles and tests Linux x86_64; only run aarch64 here
    # to avoid a duplicate ~1 GB x86_64 cache and redundant runner minutes.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.is_release == true && '[{"arch":"x86_64","target":"x86_64-unknown-linux-gnu","runner":"ubuntu-24.04"},{"arch":"aarch64","target":"aarch64-unknown-linux-gnu","runner":"ubuntu-24.04-arm"}]' || '[{"arch":"aarch64","target":"aarch64-unknown-linux-gnu","runner":"ubuntu-24.04-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux build and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang mold pkg-config \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig1-dev libssl-dev \
            libgtk-3-dev libwayland-dev libx11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and target build
        uses: Swatinem/rust-cache@v2

      - name: Run ARM64 tests (CI)
        if: ${{ !inputs.is_release && matrix.arch == 'aarch64' }}
        run: cargo test --locked --manifest-path app/Cargo.toml --target ${{ matrix.target }}

      - name: Build release binary
        if: ${{ inputs.is_release }}
        run: cargo build --release --locked --manifest-path app/Cargo.toml --target ${{ matrix.target }}

      - name: Package Linux release archive
        if: ${{ inputs.is_release }}
        run: |
          mkdir -p dist staging
          cp "target/${{ matrix.target }}/release/${APP_NAME}" staging/
          chmod +x "staging/${APP_NAME}"
          cp app/azo-type.desktop staging/
          cp LICENSE staging/
          tar -C staging -czf "dist/${APP_NAME}-${RELEASE_TAG}-${{ matrix.arch }}-linux.tar.gz" "${APP_NAME}" azo-type.desktop LICENSE

      - name: Upload Linux release artifact
        if: ${{ inputs.is_release }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.arch }}-linux
          path: dist/${{ env.APP_NAME }}-${{ env.RELEASE_TAG }}-${{ matrix.arch }}-linux.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    needs: [check]
    if: ${{ github.event_name == 'pull_request' || inputs.is_release == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            msvc_arch: amd64
          - arch: aarch64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            msvc_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Ensure app/locales directory on Windows
        shell: powershell
        run: |
          if (-not (Test-Path -Path "app/locales" -PathType Container)) {
            Remove-Item -Force -ErrorAction SilentlyContinue "app/locales"
            Copy-Item -Recurse -Force "locales" "app/locales"
          }

      - name: Set up MSVC environment
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vcvars = & $vswhere -latest -products * -find "VC\Auxiliary\Build\vcvarsall.bat" | Select-Object -First 1
          if (-not $vcvars) { throw "vcvarsall.bat not found via vswhere.exe" }
          $envDump = cmd.exe /c "`"$vcvars`" ${{ matrix.msvc_arch }} && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvarsall.bat failed with exit code $LASTEXITCODE" }
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          $seenPaths = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($p in ($env:PATH -split ';')) {
            if ($p) { [void]$seenPaths.Add($p) }
          }
          $newPaths = [System.Collections.Generic.List[string]]::new()
          $envLines = [System.Collections.Generic.List[string]]::new()
          foreach ($line in $envDump) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name = $matches[1]
              $value = $matches[2]
              if ($name -ieq 'PATH') {
                foreach ($p in ($value -split ';')) {
                  if ($p -and $seenPaths.Add($p)) {
                    $newPaths.Add($p)
                  }
                }
              } elseif ($name -match '^(INCLUDE|LIB|LIBPATH|UCRTVersion|UniversalCRTSdkDir|WindowsSdkDir|WindowsSdkLibVersion|WindowsSdkVerBinPath|WindowsSdkVersion|WindowsLibPath|ExtensionSdkDir|VCINSTALLDIR|VSINSTALLDIR|VCToolsInstallDir|VSCMD_)') {
                $envLines.Add("$name=$value")
              }
            }
          }
          if ($newPaths.Count -gt 0) {
            [System.IO.File]::AppendAllLines($env:GITHUB_PATH, $newPaths, $utf8NoBom)
          }
          if ($envLines.Count -gt 0) {
            [System.IO.File]::AppendAllLines($env:GITHUB_ENV, $envLines, $utf8NoBom)
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and target build
        uses: Swatinem/rust-cache@v2

      - name: Run Windows tests (CI)
        if: ${{ !inputs.is_release }}
        run: cargo test --locked --manifest-path app/Cargo.toml --target ${{ matrix.target }}

      - name: Build release binary
        if: ${{ inputs.is_release }}
        run: cargo build --release --locked --manifest-path app/Cargo.toml --target ${{ matrix.target }}

      - name: Package Windows release archive
        if: ${{ inputs.is_release }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist, staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${env:APP_NAME}.exe" staging/
          Copy-Item "LICENSE" staging/
          Compress-Archive -Path "staging/*" -DestinationPath "dist/${env:APP_NAME}-${env:RELEASE_TAG}-${{ matrix.arch }}-windows.zip" -Force

      - name: Upload Windows release artifact
        if: ${{ inputs.is_release }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.arch }}-windows
          path: dist/${{ env.APP_NAME }}-${{ env.RELEASE_TAG }}-${{ matrix.arch }}-windows.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS (arm64 + x86_64)
    needs: [check]
    if: ${{ github.event_name == 'pull_request' || inputs.is_release == true }}
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Cargo registry and target build
        uses: Swatinem/rust-cache@v2
        with:
          env-vars: MACOSX_DEPLOYMENT_TARGET

      - name: Validate Info.plist
        run: plutil -lint app/Info.plist

      - name: Run macOS ARM64 tests and check Intel target (CI)
        if: ${{ !inputs.is_release }}
        run: |
          cargo test --locked --manifest-path app/Cargo.toml --target aarch64-apple-darwin
          cargo check --all-targets --locked --manifest-path app/Cargo.toml --target x86_64-apple-darwin

      - name: Build release binaries (arm64 + x86_64)
        if: ${{ inputs.is_release }}
        run: |
          cargo build --release --locked --manifest-path app/Cargo.toml --target aarch64-apple-darwin
          cargo build --release --locked --manifest-path app/Cargo.toml --target x86_64-apple-darwin

      - name: Verify macOS deployment target (14.0)
        if: ${{ inputs.is_release }}
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            bin="target/${target}/release/${APP_NAME}"
            echo "=== vtool -show-build ${bin} ==="
            vtool -show-build "${bin}"
            if ! vtool -show-build "${bin}" | grep -Eq '^[[:space:]]*minos[[:space:]]+14\.0(\.0)?[[:space:]]*$'; then
              echo "Error: ${bin} does not report minos 14.0" >&2
              exit 1
            fi
          done

      - name: Package and ad-hoc sign macOS release archives
        if: ${{ inputs.is_release }}
        run: |
          if [[ "${RELEASE_TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            BUNDLE_VERSION="${BASH_REMATCH[1]}"
          else
            BUNDLE_VERSION="$(awk -F'"' '/^version = / { print $2; exit }' app/Cargo.toml)"
          fi

          mkdir -p dist
          package_arch() {
            local arch="$1"
            local rust_target="$2"
            local stage_dir="dist/staging-${arch}"
            local app_bundle="${stage_dir}/Azo Type.app"
            local archive="dist/${APP_NAME}-${RELEASE_TAG}-${arch}-macos.tar.gz"

            rm -rf "${stage_dir}"
            mkdir -p "${app_bundle}/Contents/MacOS" "${app_bundle}/Contents/Resources"
            cp "target/${rust_target}/release/${APP_NAME}" "${app_bundle}/Contents/MacOS/${APP_NAME}"
            chmod +x "${app_bundle}/Contents/MacOS/${APP_NAME}"
            cp app/icons/icon.icns "${app_bundle}/Contents/Resources/icon.icns"
            cp app/Info.plist "${app_bundle}/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${BUNDLE_VERSION}" "${app_bundle}/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUNDLE_VERSION}" "${app_bundle}/Contents/Info.plist"
            plutil -lint "${app_bundle}/Contents/Info.plist"
            cp LICENSE "${stage_dir}/LICENSE"

            codesign --force --deep --sign - "${app_bundle}"
            codesign --verify --deep --strict --verbose=2 "${app_bundle}"

            COPYFILE_DISABLE=1 tar -C "${stage_dir}" -czf "${archive}" "Azo Type.app" LICENSE
          }

          package_arch arm64 aarch64-apple-darwin
          package_arch x86_64 x86_64-apple-darwin

      - name: Upload macOS ARM64 release artifact
        if: ${{ inputs.is_release }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-arm64-macos
          path: dist/${{ env.APP_NAME }}-${{ env.RELEASE_TAG }}-arm64-macos.tar.gz
          if-no-files-found: error

      - name: Upload macOS x86_64 release artifact
        if: ${{ inputs.is_release }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-x86_64-macos
          path: dist/${{ env.APP_NAME }}-${{ env.RELEASE_TAG }}-x86_64-macos.tar.gz
          if-no-files-found: error
