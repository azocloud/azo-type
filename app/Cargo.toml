[package]
name = "typst-ide"
version = "0.3.0"
edition = "2021"
description = "Native Cross-Platform Typst IDE with P2P Real-Time Collaborative Editing"
authors = ["Typst IDE Architect"]

[dependencies]
egui = "0.31.1"
eframe = { version = "0.31.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
typst = "0.12.0"
typst-render = "0.12.0"
typst-pdf = "0.12.0"
typst-assets = { version = "0.12.0", features = ["fonts"] }
typst-syntax = "0.12.0"
comemo = "0.4"
ecow = "0.2"
rfd = "0.18.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"

# P2P Real-Time Collaboration (CRDT + Iroh QUIC transport)
yrs = { version = "0.28.1", features = ["sync"] }
iroh = "=1.4.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "io-util", "net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
rand = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }
