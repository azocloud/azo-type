[package]
name = "typst-ide"
version = "0.1.0"
edition = "2021"
description = "Cross-Platform & Web Typst IDE and Live Previewer in Rust"
authors = ["Typst IDE Architect"]

[dependencies]
egui = "0.31.1"
eframe = { version = "0.31.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "web_screen_reader",
    "x11",
] }
typst = "0.12.0"
typst-render = "0.12.0"
typst-pdf = "0.12.0"
typst-assets = { version = "0.12.0", features = ["fonts"] }
typst-syntax = "0.12.0"
comemo = "0.4"
ecow = "0.2"
rfd = "0.18.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
] }
