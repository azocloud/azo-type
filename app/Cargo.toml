[package]
name = "typst-ide"
version = "0.3.0"
edition = "2021"
description = "Native Cross-Platform Typst IDE with P2P Real-Time Collaborative Editing"
authors = ["Typst IDE Architect"]

[dependencies]
egui = "0.31.1"
eframe = { version = "0.31.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
typst = "0.15.1"
typst-layout = "0.15.1"
typst-render = "0.15.1"
typst-pdf = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-syntax = "0.15.1"
typst-kit = { version = "0.15.1", features = [
    "embedded-fonts",
    "scan-fonts",
    "system-files",
    "system-packages",
    "universe-packages",
    "datetime",
] }
comemo = "0.5"
ecow = "0.2"
reqwest = { version = "0.13", default-features = false }
arboard = "3.7"
rfd = "0.18.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# P2P Real-Time Collaboration (CRDT + Iroh QUIC transport)
yrs = { version = "0.28.1", features = ["sync"] }
iroh = "=1.4.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "io-util", "net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
rand = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }
