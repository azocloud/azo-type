[package]
name = "typst-ide"
version = "0.2.0"
edition = "2021"
description = "Native Cross-Platform Typst IDE and Live Previewer in Rust (Linux, macOS, Windows)"
authors = ["Typst IDE Architect"]

[dependencies]
egui = "0.31.1"
eframe = { version = "0.31.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
typst = "0.12.0"
typst-render = "0.12.0"
typst-pdf = "0.12.0"
typst-assets = { version = "0.12.0", features = ["fonts"] }
typst-syntax = "0.12.0"
comemo = "0.4"
ecow = "0.2"
rfd = "0.18.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }
