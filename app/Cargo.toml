[package]
name = "azo-type"
version = "0.3.0"
edition = "2021"
description = "Native Cross-Platform Typst IDE with P2P Real-Time Collaborative Editing"
authors = ["Azo Type Architect"]

[dependencies]
egui = "0.31.1"
eframe = { version = "0.31.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
typst = "0.15.1"
typst-layout = "0.15.1"
typst-render = "0.15.1"
typst-pdf = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-syntax = "0.15.1"
typst-kit = { version = "0.15.1", features = [
    "embedded-fonts",
    "scan-fonts",
    "system-files",
    "system-packages",
    "universe-packages",
    "datetime",
] }
comemo = "0.5"
ecow = "0.2"
reqwest = { version = "0.13", default-features = false }
arboard = "3.7"
rfd = "0.18.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# P2P Real-Time Collaboration (CRDT + Iroh QUIC transport)
yrs = { version = "0.28.1", features = ["sync"] }
iroh = "=1.4.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "io-util", "net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
rand = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.bundle]
name = "Azo Type"
identifier = "app.azotype.editor"
icon = [
    "icons/win-16.png",
    "icons/win-32.png",
    "icons/win-48.png",
    "icons/win-64.png",
    "icons/win-128.png",
    "icons/win-256.png",
    "icons/icon-1024.png",
]
version = "0.3.0"
copyright = "Copyright (c) 2026 Azo Type Architect"
category = "Productivity"
short_description = "Native Cross-Platform Typst IDE"
long_description = "Native Cross-Platform Typst IDE with P2P Real-Time Collaborative Editing"

[lints.rust]
unused_must_use = "warn"

[lints.clippy]
if_same_then_else = "warn"
collapsible_match = "warn"
derivable_impls = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = 3          # Maximale Optimierung auf Ausführungsgeschwindigkeit
lto = "fat"            # Link-Time-Optimization über alle Crates hinweg (verkleinert Binary & beschleunigt Rendering)
codegen-units = 1      # Zwingt den Compiler zu maximaler Optimierung (erhöht die Build-Dauer leicht, verkleinert aber die App drastisch)
strip = true           # Entfernt alle Debug-Symbole und Symboltabellen restriktiv (macht die .exe/.elf extrem schlank)
panic = "abort"        # Schaltet Stack-Unwinding bei Panics ab (reduziert Binärgröße und spart Overhead)

